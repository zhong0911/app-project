# ============ 生产环境 ============
# 数据库连接全部从环境变量（.env 或系统环境变量）读取，禁止明文提交密码

server:
  servlet:
    session:
      cookie:
        # 生产必须 HTTPS，会话 Cookie 仅通过 HTTPS 传输
        secure: true

app:
  security:
    # 生产关闭本地联调用的 httpBasic 内存用户
    basic-enabled: false

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

mybatis-plus:
  configuration:
    # 生产关闭 SQL 打印
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: info
    cc.antx.template: info
