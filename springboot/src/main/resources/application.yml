# ============ 公共配置（所有环境生效） ============
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# SSO 登录成功后的重定向地址（生产子应用通常指向前端首页，如 https://tools.antx.cc）
sso:
  login-success-url: ${SSO_LOGIN_SUCCESS_URL:/api/auth/me}
  # 单点退出地址（授权服务器登出端点；前端 /logout 页拿到后整页跳转完成全局退出，留空仅退出本应用）
  logout-uri: ${SSO_LOGOUT_URI:}

spring:
  application:
    name: springboot-template

  # 当前激活环境：dev / prod（命令行可用 --spring.profiles.active=prod 覆盖）
  profiles:
    active: dev

  # Redis（敏感值由 .env 提供）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 会话（Session）存储：默认内存 HttpSession，改为 Redis 后多实例共享、重启不掉线
  # 会连同 OAuth2 的 access_token / refresh_token 一起存进 Redis
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: spring:session

  # Jackson 序列化（HTTP JSON 响应全局格式）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 邮件发送（SMTP 配置由 .env 提供）
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 5000

  # Spring Security：内存用户（仅本地联调用）
  security:
    user:
      name: ${SECURITY_ADMIN_USERNAME:admin}
      password: ${SECURITY_ADMIN_PASSWORD:admin123}
      roles: ADMIN
    # OAuth2 接入 SSO（passport-sso）：子应用作为客户端（授权码登录）+ 资源服务器（Bearer 保护 API）
    oauth2:
      # 客户端：跳转 SSO 登录页 / callback 回调
      client:
        registration:
          sso:
            # 子应用在 SSO 控制台注册的 client-id / client-secret（默认 passport.antx.cc，client-id 先用 app 占位）
            client-id: ${SSO_CLIENT_ID:app}
            client-secret: ${SSO_CLIENT_SECRET:your-sso-client-secret}
            scope: openid,profile,email,roles,permissions
            authorization-grant-type: authorization_code
            # callback 回调地址（规范路径 /oauth2/{provider}/callback，需在 SSO 控制台注册为 redirect_uri）
            redirect-uri: "{baseUrl}/oauth2/{registrationId}/callback"
            client-name: AntX SSO
        provider:
          sso:
            # 显式配置端点（Spring Authorization Server 标准路径，默认 passport.antx.cc），避免启动时依赖 SSO 在线做 discovery
            authorization-uri: ${SSO_AUTHORIZATION_URI:https://passport.antx.cc/oauth2/authorize}
            token-uri: ${SSO_TOKEN_URI:https://passport.antx.cc/oauth2/token}
            user-info-uri: ${SSO_USERINFO_URI:https://passport.antx.cc/userinfo}
            jwk-set-uri: ${SSO_JWKS_URI:https://passport.antx.cc/oauth2/jwks}
            # 用 preferred_username 作为登录用户 name；缺失时回退 sub
            user-name-attribute: preferred_username
      # 资源服务器：校验 SSO 签发的 JWT（Bearer token）
      resourceserver:
        jwt:
          issuer-uri: ${SSO_ISSUER:https://passport.antx.cc}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cc.antx.template.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 日志（生产可关闭，见各 profile）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除字段与值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略：数据库自增
      id-type: auto

# ============ 日志 ============
logging:
  config: classpath:logback-spring.xml

# 可选：接口访问日志切面开关（不需要可关闭或删除）
web:
  log:
    enabled: true
