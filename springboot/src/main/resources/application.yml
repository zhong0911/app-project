# ============ 公共配置（所有环境生效） ============
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true
        # 会话 Cookie 仅同站发送；prod 额外开启 secure（见 application-prod.yml）
        same-site: lax

# SSO 登录成功后的兜底地址（优先用前端 /sso/authorize?redirect_uri=xxx 透传的回跳页，
# 没有或校验不通过才落到这里；默认 / 即前端首页）
sso:
  login-success-url: ${SSO_LOGIN_SUCCESS_URL:/}
  # 管理员 SSO uid（access_token 的 sub）；默认 uid=1，可按部署在 .env / application-*.yml 覆盖
  admin-uid: ${SSO_ADMIN_UID:1}
  # 单点退出地址（授权服务器登出端点；前端 /logout 页拿到后整页跳转完成全局退出，留空仅退出本应用）
  logout-uri: ${SSO_LOGOUT_URI:}
  # token 撤销端点（Spring Authorization Server 标准路径；退出登录时后端撤销会话中的 refresh_token）
  revoke-uri: ${SSO_REVOKE_URI:https://passport.antx.cc/oauth2/revoke}

# 应用自定义配置
app:
  cors:
    # 允许携带会话 Cookie 的前端来源（逗号分隔）；生产必须替换为实际前端域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    # 本地联调 httpBasic 开关；生产通过 application-prod.yml 关闭
    basic-enabled: ${SECURITY_BASIC_ENABLED:true}

spring:
  application:
    name: springboot-template

  # 加载工作目录下的 .env（十二要素配置）：按 properties 格式解析，键名原样进入 Environment，
  # 下方 ${SSO_CLIENT_ID} / ${DB_PASSWORD} 等占位符即可解析。optional 前缀表示文件缺失时不报错。
  config:
    import: optional:file:./.env[.properties]

  # 当前激活环境：dev / prod（命令行可用 --spring.profiles.active=prod 覆盖）
  profiles:
    active: dev

  # Redis（敏感值由 .env 提供）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # 会话（Session）存储：由 config/RedisSessionConfig 的 @EnableRedisHttpSession 启用，
  # 复用上面的 spring.data.redis 连接；OAuth2 的 access_token / refresh_token 随会话一起写入 Redis

  # Jackson 序列化（HTTP JSON 响应全局格式）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 邮件发送（SMTP 配置由 .env 提供）
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 5000

  # Spring Security：内存用户（仅本地联调用）
  security:
    user:
      name: ${SECURITY_ADMIN_USERNAME:admin}
      password: ${SECURITY_ADMIN_PASSWORD:admin123}
      roles: ADMIN
    # OAuth2 接入 SSO（passport-sso）：子应用作为客户端（授权码登录）+ 资源服务器（Bearer 保护 API）
    oauth2:
      # 客户端：跳转 SSO 登录页 / callback 回调
      client:
        registration:
          sso:
            # 子应用在 SSO 控制台注册的 client-id / client-secret（默认 passport.antx.cc，均先用占位值）
            client-id: ${SSO_CLIENT_ID:your-sso-client-id}
            client-secret: ${SSO_CLIENT_SECRET:your-sso-client-secret}
            # 默认只申请 openid（够用：登录只消费 sub）；需要更多声明时用 SSO_SCOPE 覆盖，
            # 例如 SSO_SCOPE=openid,profile,email,roles,permissions
            scope: ${SSO_SCOPE:openid}
            authorization-grant-type: authorization_code
            # callback 回调地址：默认 "{baseUrl}/sso/callback"（随当前请求的 host:port 变化）；
            # 若 SSO 控制台只登记了固定地址，用 .env 的 SSO_REDIRECT_URI 显式覆盖，
            # 否则端口一变（8080/8081/3001...）就会因 redirect_uri 未登记被 SSO 拒绝。
            redirect-uri: ${SSO_REDIRECT_URI:{baseUrl}/sso/callback}
            client-name: AntX SSO
        provider:
          sso:
            # 显式配置端点（Spring Authorization Server 标准路径，默认 passport.antx.cc），避免启动时依赖 SSO 在线做 discovery
            authorization-uri: ${SSO_AUTHORIZATION_URI:https://passport.antx.cc/oauth2/authorize}
            token-uri: ${SSO_TOKEN_URI:https://passport.antx.cc/oauth2/token}
            user-info-uri: ${SSO_USERINFO_URI:https://passport.antx.cc/userinfo}
            jwk-set-uri: ${SSO_JWKS_URI:https://passport.antx.cc/oauth2/jwks}
            # 用 sub 作为登录用户 name：只申请 openid 时 SSO 不保证返回 preferred_username，
            # 需显示昵称时另配 SSO_USER_NAME_ATTRIBUTE=preferred_username 并申请 profile
            user-name-attribute: ${SSO_USER_NAME_ATTRIBUTE:sub}
      # 资源服务器：校验 SSO 签发的 JWT（Bearer token）
      resourceserver:
        jwt:
          issuer-uri: ${SSO_ISSUER:https://passport.antx.cc}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cc.antx.template.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 日志（生产可关闭，见各 profile）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除字段与值
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略：数据库自增
      id-type: auto

# ============ 日志 ============
logging:
  config: classpath:logback-spring.xml

# 可选：接口访问日志切面开关（不需要可关闭或删除）
web:
  log:
    enabled: true
