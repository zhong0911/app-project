# ============================================================
# AntX 模板 —— Docker 编排（可复制复用的应用栈）
# 组成：MySQL + Redis + Spring Boot 后端 + Vue 前端(Nginx 反代)
#
# 用法：
#   1) cp .env.example .env  并修改（数据库密码、SSO 等）
#   2) docker compose up -d --build
#   3) 浏览器访问 http://服务器IP:${WEB_PORT}
#
# 每个新应用：复制整个模板目录 → 修改根目录 .env 即可
# ============================================================

name: ${COMPOSE_PROJECT_NAME:-antx-template}

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-antx-template}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-antx_template}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表并写入初始数据
      - ./api/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-antx-template}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Spring Boot 后端 ----------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-antx-template}-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      # 数据库（容器内走 mysql 服务名）
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-antx_template}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      REDIS_DATABASE: 0
      # 邮件（可选）
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Security 内存用户（仅本地联调）
      SECURITY_ADMIN_USERNAME: ${SECURITY_ADMIN_USERNAME:-admin}
      SECURITY_ADMIN_PASSWORD: ${SECURITY_ADMIN_PASSWORD:-admin123}
      # SSO（passport-sso 授权码登录；端点留空则用 SSO_ISSUER 的标准路径）
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_AUTHORIZATION_URI: ${SSO_AUTHORIZATION_URI:-}
      SSO_TOKEN_URI: ${SSO_TOKEN_URI:-}
      SSO_USERINFO_URI: ${SSO_USERINFO_URI:-}
      SSO_JWKS_URI: ${SSO_JWKS_URI:-}
      SSO_LOGIN_SUCCESS_URL: ${SSO_LOGIN_SUCCESS_URL:-/}
      TZ: Asia/Shanghai
    ports:
      - "${API_PORT:-8080}:8080"

  # ---------- Vue 前端（Nginx） ----------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-antx-template}-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
