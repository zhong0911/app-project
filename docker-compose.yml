services:
  paas:
    build:
      context: ./paas-server
    container_name: antx-paas
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./paas-server/.env
    environment:
      NODE_ENV: production
      PAAS_EXECUTOR: docker
      DOCKER_MODE: socket
      DOCKER_SOCKET: /var/run/docker.sock
      # 首次启动的管理员账号，部署前请修改
      PAAS_ADMIN_USER: admin
      PAAS_ADMIN_PASSWORD: admin123456
      # 对外访问域名，如 https://apps.example.com
      PAAS_PUBLIC_HOST: ""
      PAAS_WEB_DIST: /app/web-dist
      # SSO 回调地址（生产必须与 SSO 控制台登记的一致）
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
    volumes:
      # 平台需要在宿主机上创建兄弟容器
      - /var/run/docker.sock:/var/run/docker.sock
      # 构建工作目录 + SQLite 持久化
      - ./paas-server/data:/app/data
      # 前端构建产物：控制台前端在历史提交 3698cfd，vue/ 已回退为通用模板
      # 需控制台时先取回 PaaS 页面再在 vue 目录 npm run build
      - ./vue/dist:/app/web-dist:ro
